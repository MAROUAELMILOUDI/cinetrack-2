<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>CinéTrack</title>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans">
    <section class="relative min-h-[520px] overflow-hidden">
        <img src="./img/dark image.jpeg" alt="Background image" class="absolute inset-0 h-full w-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-r from-gray-950 via-gray-950/70 to-transparent"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-transparent to-transparent"></div>
        <header class="relative z-10 border-b border-white/10 bg-gradient-to-b from-black/60 to-transparent">
            <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-6 py-3">
                <img src="./img/logo.svg" alt="Logo de CinéTrack" class="h-10 w-auto">
                <div class="flex items-center gap-3">
                    <div class="search relative flex items-center">
                        <input type="text" id="movies" placeholder="Search movies or series..." class="bg-gray-950 focus:border-4 border-red-600 w-full text-sm sm:text-base p-2.5 pr-10 rounded-lg outline-none shadow text-white transition-all">
                        <span class="absolute right-3 flex items-center pointer-events-none text-gray-500">
                            <i class="fa fa-search"></i>
                        </span>
                    </div>
                    <button id="fav-btn" class="heart bg-gray-950 border border-gray-700 text-sm sm:text-base p-2.5 rounded-lg shadow text-gray-500 hover:text-white">
                        <i class="fa-regular fa-heart"></i> 
                    </button>
                    <a href="admin.html" class="bg-red-600/60 border border-gray-700 text-sm sm:text-base p-2.5 rounded-lg shadow text-white hover:bg-red-600">
                       Administration
                    </a>
                </div>
            </div>
        </header>
        <div class="pageIntroduction relative z-10 mx-auto max-w-6xl px-6 pt-24">
            <p class="font-serif font-bold text-2xl text-balance max-w-xl">
                CinéTrack lets you search movies and series, build your watchlist, and rate what you love, all in one place.
            </p>
        </div>
        <div class="relative z-10 mx-auto max-w-6xl px-6 flex justify-end mt-16 pb-8">
            <select name="statut" id="statut" class="bg-gray-900 w-36 text-sm sm:text-base p-2.5 focus:border-4 border-red-600 rounded-lg outline-none shadow transition-all">
                <option value="all">All</option>
                <option value="movies">Movies</option>
                <option value="series">Series</option>
            </select>
        </div>
    </section>
    <section class="relative z-10 bg-gray-950">
        <div id="cards-container" class="mx-auto max-w-6xl px-6 pt-4 grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </section>
    <section class="w-full">
        <div id="pagination" class="flex items-center justify-center gap-2 mt-6"></div>
    </section> 
    <div id="fav-overlay" class="hidden fixed inset-0 z-40 bg-black/60"></div>
    <aside id="fav-sidebar" class="fixed right-0 top-0 z-50 flex h-full w-80 max-w-full translate-x-full flex-col border-l border-white/20 bg-gray-900 transition-transform duration-300">
        <div class="flex items-center justify-between p-4 border-b border-white/20">
            <h2 class="text-lg font-bold">My collection</h2>
            <button class="close-fav text-2xl text-gray-400 hover:text-white">
                &times;
            </button>
        </div>
        <div id="fav-list" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
    </aside>
    <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center overflow-y-auto bg-black/70 p-2 sm:p-4">
        <div id="modal-wrapper" class="flex w-full max-w-6xl flex-col items-stretch justify-center gap-4 md:flex-row">
            <div id="modal-box" class="relative w-full min-w-0 md:w-[640px] md:flex-1 max-h-[85vh] overflow-y-auto rounded-xl bg-gray-900 p-4 sm:p-6 md:p-8 text-white">
                <span class="close-btn absolute right-4 top-3 cursor-pointer">×</span>
                <div id="modal-body"></div>
            </div>
            <aside id="com-panel" class="hidden w-full min-w-0 flex-1 max-h-[85vh] overflow-y-auto rounded-xl bg-gray-900 p-4 sm:p-5 md:p-6 text-white">
                <h3 class="mb-4 text-lg font-bold">Share your review</h3>
                <form id="com-form" class="space-y-3">
                    <input type="text" id="com-name" placeholder="Your name" required class="w-full rounded-md bg-gray-700 px-3 py-2 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-600">
                    <select id="com-rating" class="w-full rounded-md bg-gray-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-600">
                        <option value="5">★★★★★</option>
                        <option value="4">★★★★</option>
                        <option value="3">★★★</option>
                        <option value="2">★★</option>
                        <option value="1">★</option>
                    </select>
                    <textarea id="com-text" rows="3" placeholder="Write your comment..." required class="w-full rounded-md bg-gray-700 px-3 py-2 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-600"></textarea>
                    <button type="submit" class="w-full rounded-md bg-red-600 px-4 py-2 text-sm font-semibold hover:bg-red-700">
                        Send
                    </button>
                </form>
                <h4 class="mb-3 mt-6 font-semibold text-gray-300">Comments</h4>
                <div id="com-list" class="space-y-3"></div>
            </aside>
        </div>
    </div>
    <script type="module" src="./index.js/cards.js"></script>
</body>
</html>
